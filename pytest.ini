[pytest]
testpaths = tests
# ---- marker 分层(#87,2026-09-25)----
# `slow` 的名单是**量出来的**,不是拍脑袋:那次 `pytest -q --durations=0` 实测全量
# 342 s,其中 test_gui_bridge(64 s)/ test_subagent(51 s)/ test_web_server(51 s)/
# test_model_manage(37 s)/ test_workspace(37 s)五个文件就占掉 240 s —— 它们慢在
# 真线程、真 socket、真超时等待,不是算得慢。另外 test_shell / test_sandbox 里各有一
# 条真等 5 s 超时的用例,单独打标。
#   pytest -m "not slow"     日常改一行回头看(实测约 100 s)
#   pytest -m slow           只跑耗时大户
# 名单会变:重跑一次 --durations=0 再调整,并把新数字写回这里(别留旧数当装饰)。
markers =
    slow: 实测耗时大户(整文件级,或单条 ≥4s):真线程 / 真 socket / 真超时
